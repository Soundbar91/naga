name: Commerce 이미지 게시

on:
  push:
    branches:
      - main
    paths:
      - "commerce-api/**"
      - "deploy/commerce/Dockerfile"
      - ".github/workflows/commerce-image.yml"
  workflow_dispatch:

concurrency:
  group: commerce-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: soundbar91/naga-commerce-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: QEMU 설정
        uses: docker/setup-qemu-action@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 메타데이터 생성
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 이미지 빌드 및 게시
        uses: docker/build-push-action@v7
        with:
          context: ./commerce-api
          file: ./deploy/commerce/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
