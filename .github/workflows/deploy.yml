name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_namespace: ${{ steps.image_namespace.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image namespace
        id: image_namespace
        shell: bash
        run: echo "value=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push commerce-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/commerce-api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image_namespace.outputs.value }}/naga-commerce-api:${{ github.sha }}
          cache-from: type=gha,scope=commerce-api
          cache-to: type=gha,mode=max,scope=commerce-api

      - name: Build and push pg-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pg-api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image_namespace.outputs.value }}/naga-pg-api:${{ github.sha }}
          cache-from: type=gha,scope=pg-api
          cache-to: type=gha,mode=max,scope=pg-api

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run server deployment script
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: >
            sudo -n '${{ secrets.MAIN_DEPLOY_SCRIPT_PATH }}'
            '${{ github.sha }}'
            '${{ needs.build-and-push.outputs.image_namespace }}'
