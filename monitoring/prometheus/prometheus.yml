global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: commerce-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - commerce-api:8080
        labels:
          environment: local

  - job_name: pg-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - pg-api:8081
        labels:
          environment: local
