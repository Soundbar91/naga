services:
  mysql:
    image: mysql:8.4
    container_name: commerce-api-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: commerce
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - commerce-api-mysql-data:/var/lib/mysql

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: commerce-api-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - commerce-api-prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    restart: unless-stopped

volumes:
  commerce-api-mysql-data:
  commerce-api-prometheus-data:
