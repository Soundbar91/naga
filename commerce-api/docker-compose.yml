services:
  mysql:
    image: mysql:8.4
    container_name: commerce-api-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: commerce
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - commerce-api-mysql-data:/var/lib/mysql

volumes:
  commerce-api-mysql-data:
